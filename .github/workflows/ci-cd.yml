name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur la même branche annule le run encore en cours
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_IMAGE: lazher789/redstore-backend
  FRONTEND_IMAGE: lazher789/redstore-frontend

# Actions tierces épinglées sur un SHA de commit (version en commentaire).
# Les secrets ne sont pas utilisables dans un "if:" : on les passe en env et on teste env.X.
jobs:
  # ---------- 1. Frontend : lint + build ----------
  lint-frontend:
    name: Lint & build frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ---------- 2. Backend : pas de tests, vérification syntaxe + chargement des modules ----------
  check-backend:
    name: Check backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Syntax check (node --check)
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Load modules (sans base de données)
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          for (const d of ['config', 'util', 'model', 'middlewares', 'controller', 'routes'])
            for (const f of fs.readdirSync(d).filter(f => f.endsWith('.js'))) {
              require(path.resolve(d, f));
              console.log('ok', d + '/' + f);
            }
          "

  # ---------- 8. Snyk : vulnérabilités des dépendances npm ----------
  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: SNYK_TOKEN absent
        if: env.SNYK_TOKEN == ''
        run: 'echo "::notice::Secret SNYK_TOKEN absent : scan Snyk ignoré."'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SNYK_TOKEN != ''

      # Snyk lit node_modules : chaque job démarre sur une machine vide, on installe ici
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SNYK_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        if: env.SNYK_TOKEN != ''
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Install frontend dependencies
        if: env.SNYK_TOKEN != ''
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Snyk - backend
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          args: --file=backend/package.json --severity-threshold=high

      - name: Snyk - frontend
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          args: --file=frontend/package.json --severity-threshold=high

  # ---------- 3. SonarQube Cloud ----------
  sonarqube:
    name: SonarQube Cloud
    needs: [lint-frontend, check-backend, snyk]
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: SONAR_TOKEN absent
        if: env.SONAR_TOKEN == ''
        run: 'echo "::notice::Secret SONAR_TOKEN absent : analyse SonarQube ignorée."'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # Historique complet : nécessaire à Sonar pour attribuer le nouveau code
          fetch-depth: 0

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  # ---------- 4. Image backend (tag SHA court uniquement) ----------
  docker-backend:
    name: Build & push backend image
    needs: sonarqube
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          # Version renvoyée par GET /api/health : le smoke test s'en sert pour savoir
          # que Render sert bien ce commit
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.sha_short }}
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=redstore-backend
          cache-to: type=gha,mode=max,scope=redstore-backend

  # ---------- 5. Image frontend (tag SHA court uniquement) ----------
  docker-frontend:
    name: Build & push frontend image
    needs: sonarqube
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=redstore-frontend
          cache-to: type=gha,mode=max,scope=redstore-frontend

  # ---------- 6. Trivy : bloque sur CRITICAL corrigeable, rapporte aussi HIGH ----------
  trivy-scan:
    name: Trivy image scan
    needs: [docker-backend, docker-frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [redstore-backend, redstore-frontend]
    steps:
      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Login pour éviter les limites de pull anonymes de Docker Hub
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Rapport HIGH + CRITICAL (non bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lazher789/${{ matrix.image }}:${{ steps.vars.outputs.sha_short }}
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: '0'

      - name: Publication du rapport dans le résumé
        if: always()
        run: |
          {
            echo "## Trivy : lazher789/${{ matrix.image }}:${{ steps.vars.outputs.sha_short }}"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "Rapport indisponible"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Contrôle CRITICAL corrigeables (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lazher789/${{ matrix.image }}:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

  # ---------- 7. Promotion en latest + déploiement Render ----------
  deploy:
    name: Tag latest & deploy to Render
    needs: trivy-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Ajoute le tag latest au manifeste déjà scanné, sans rebuild
      - name: Tag latest
        env:
          SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          for img in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            docker buildx imagetools create -t "$img:latest" "$img:$SHA"
          done

      # Hook absent => message + succès (le déploiement Render n'est pas encore configuré).
      - name: Trigger Render deploy hooks
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          trigger() {
            name="$1"; url="$2"
            if [ -z "$url" ]; then
              echo "::notice::Secret RENDER_DEPLOY_HOOK_${name} absent : déploiement ${name} ignoré."
              return 0
            fi
            echo "Déclenchement du déploiement ${name}..."
            curl -fsS -X POST "$url" -o /dev/null
            echo "Déploiement ${name} déclenché."
          }
          trigger BACKEND "$HOOK_BACKEND"
          trigger FRONTEND "$HOOK_FRONTEND"

  # ---------- 9. Smoke test sur l'environnement Render déployé ----------
  smoke-test:
    name: Smoke test (Render)
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      FRONTEND_URL: https://redstore-frontend-tmxu.onrender.com
      HEALTH_URL: https://redstore-frontend-tmxu.onrender.com/api/health
      PRODUCTS_URL: https://redstore-frontend-tmxu.onrender.com/api/product/allProd
      # Services gratuits Render : réveil + redéploiement lents
      TIMEOUT_SECONDS: 480
      INTERVAL_SECONDS: 15
      HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
      HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
    steps:
      - name: Secrets Render absents
        if: env.HOOK_BACKEND == '' || env.HOOK_FRONTEND == ''
        run: 'echo "::notice::Secrets RENDER_DEPLOY_HOOK_* absents : aucun déploiement déclenché, smoke test ignoré."'

      - name: Short SHA
        id: vars
        if: env.HOOK_BACKEND != '' && env.HOOK_FRONTEND != ''
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Attend que le backend Render serve CE commit (version = SHA court) avec la base connectée
      - name: Attente du déploiement (/api/health)
        if: env.HOOK_BACKEND != '' && env.HOOK_FRONTEND != ''
        env:
          EXPECTED_VERSION: ${{ steps.vars.outputs.sha_short }}
        run: |
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            body=$(curl -sS --max-time 30 "$HEALTH_URL" 2>/dev/null || true)
            version=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)
            db=$(printf '%s' "$body" | jq -r '.db // empty' 2>/dev/null || true)
            echo "Essai $attempt : version=${version:-?} db=${db:-?} (attendu : version=$EXPECTED_VERSION db=up)"

            if [ "$version" = "$EXPECTED_VERSION" ] && [ "$db" = "up" ]; then
              echo "HEALTH_RESULT=✅ version $version, db up (essai $attempt)" >> "$GITHUB_ENV"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              msg="Après ${TIMEOUT_SECONDS}s, $HEALTH_URL renvoie version=${version:-?} db=${db:-?} au lieu de version=$EXPECTED_VERSION db=up."
              echo "HEALTH_RESULT=❌ $msg" >> "$GITHUB_ENV"
              echo "::error title=Smoke test : déploiement non confirmé::$msg"
              exit 1
            fi
            sleep "$INTERVAL_SECONDS"
          done

      - name: Vérification des pages et de l'API
        if: env.HOOK_BACKEND != '' && env.HOOK_FRONTEND != ''
        run: |
          failures=0
          : > smoke-results.md

          # check <nom> <url> <type de contenu attendu>
          check() {
            name="$1"; url="$2"; expected_type="$3"
            out=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code} %{content_type}' "$url" 2>/dev/null || echo "000 -")
            code="${out%% *}"; type="${out#* }"
            if [ "$code" = "200" ] && printf '%s' "$type" | grep -qi "$expected_type"; then
              echo "| \`$name\` | ✅ | $code | $type |" >> smoke-results.md
              echo "OK   $name -> $code $type"
            else
              echo "| \`$name\` | ❌ | $code | $type |" >> smoke-results.md
              echo "::error title=Smoke test : $name::$url a répondu $code ($type), attendu 200 avec $expected_type."
              failures=$((failures + 1))
            fi
          }

          check "/" "$FRONTEND_URL/" "text/html"
          check "/cart (fallback SPA)" "$FRONTEND_URL/cart" "text/html"
          check "/api/product/allProd" "$PRODUCTS_URL" "application/json"

          [ "$failures" -eq 0 ] || exit 1

      - name: Résumé
        if: ${{ always() && env.HOOK_BACKEND != '' && env.HOOK_FRONTEND != '' }}
        run: |
          {
            echo "## Smoke test : $FRONTEND_URL"
            echo
            echo "**Santé :** ${HEALTH_RESULT:-❌ vérification de santé non terminée}"
            echo
            if [ -s smoke-results.md ]; then
              echo "| Vérification | Résultat | HTTP | Content-Type |"
              echo "|---|---|---|---|"
              cat smoke-results.md
            else
              echo "Vérifications des pages non exécutées (santé non confirmée)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
