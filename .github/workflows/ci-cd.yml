name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur la même branche annule le run encore en cours
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_IMAGE: lazher789/redstore-backend
  FRONTEND_IMAGE: lazher789/redstore-frontend

# Actions tierces épinglées sur un SHA de commit (version en commentaire).
# Les secrets ne sont pas utilisables dans un "if:" : on les passe en env et on teste env.X.
jobs:
  # ---------- 1. Frontend : lint + build ----------
  lint-frontend:
    name: Lint & build frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ---------- 2. Backend : pas de tests, vérification syntaxe + chargement des modules ----------
  check-backend:
    name: Check backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Syntax check (node --check)
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Load modules (sans base de données)
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          for (const d of ['config', 'util', 'model', 'middlewares', 'controller', 'routes'])
            for (const f of fs.readdirSync(d).filter(f => f.endsWith('.js'))) {
              require(path.resolve(d, f));
              console.log('ok', d + '/' + f);
            }
          "

  # ---------- 8. Snyk : vulnérabilités des dépendances npm ----------
  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: SNYK_TOKEN absent
        if: env.SNYK_TOKEN == ''
        run: 'echo "::notice::Secret SNYK_TOKEN absent : scan Snyk ignoré."'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SNYK_TOKEN != ''

      - name: Snyk - backend
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          args: --file=backend/package.json --severity-threshold=high

      - name: Snyk - frontend
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          args: --file=frontend/package.json --severity-threshold=high

  # ---------- 3. SonarQube Cloud ----------
  sonarqube:
    name: SonarQube Cloud
    needs: [lint-frontend, check-backend, snyk]
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: SONAR_TOKEN absent
        if: env.SONAR_TOKEN == ''
        run: 'echo "::notice::Secret SONAR_TOKEN absent : analyse SonarQube ignorée."'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # Historique complet : nécessaire à Sonar pour attribuer le nouveau code
          fetch-depth: 0

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  # ---------- 4. Image backend (tag SHA court uniquement) ----------
  docker-backend:
    name: Build & push backend image
    needs: sonarqube
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=redstore-backend
          cache-to: type=gha,mode=max,scope=redstore-backend

  # ---------- 5. Image frontend (tag SHA court uniquement) ----------
  docker-frontend:
    name: Build & push frontend image
    needs: sonarqube
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=redstore-frontend
          cache-to: type=gha,mode=max,scope=redstore-frontend

  # ---------- 6. Trivy : bloque sur CRITICAL corrigeable, rapporte aussi HIGH ----------
  trivy-scan:
    name: Trivy image scan
    needs: [docker-backend, docker-frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [redstore-backend, redstore-frontend]
    steps:
      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Login pour éviter les limites de pull anonymes de Docker Hub
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Rapport HIGH + CRITICAL (non bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lazher789/${{ matrix.image }}:${{ steps.vars.outputs.sha_short }}
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: '0'

      - name: Publication du rapport dans le résumé
        if: always()
        run: |
          {
            echo "## Trivy : lazher789/${{ matrix.image }}:${{ steps.vars.outputs.sha_short }}"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "Rapport indisponible"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Contrôle CRITICAL corrigeables (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lazher789/${{ matrix.image }}:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

  # ---------- 7. Promotion en latest + déploiement Render ----------
  deploy:
    name: Tag latest & deploy to Render
    needs: trivy-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Ajoute le tag latest au manifeste déjà scanné, sans rebuild
      - name: Tag latest
        env:
          SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          for img in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            docker buildx imagetools create -t "$img:latest" "$img:$SHA"
          done

      # Hook absent => message + succès (le déploiement Render n'est pas encore configuré).
      - name: Trigger Render deploy hooks
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          trigger() {
            name="$1"; url="$2"
            if [ -z "$url" ]; then
              echo "::notice::Secret RENDER_DEPLOY_HOOK_${name} absent : déploiement ${name} ignoré."
              return 0
            fi
            echo "Déclenchement du déploiement ${name}..."
            curl -fsS -X POST "$url" -o /dev/null
            echo "Déploiement ${name} déclenché."
          }
          trigger BACKEND "$HOOK_BACKEND"
          trigger FRONTEND "$HOOK_FRONTEND"
