name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur la même branche annule le run encore en cours
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---------- Backend (pas de tests : vérification syntaxe + chargement des modules) ----------
      - name: Backend - install
        working-directory: backend
        run: npm ci

      - name: Backend - syntax check (node --check)
        working-directory: backend
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Backend - load modules (sans base de données)
        working-directory: backend
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          for (const d of ['config', 'util', 'model', 'middlewares', 'controller', 'routes'])
            for (const f of fs.readdirSync(d).filter(f => f.endsWith('.js'))) {
              require(path.resolve(d, f));
              console.log('ok', d + '/' + f);
            }
          "

      # ---------- Frontend ----------
      - name: Frontend - install
        working-directory: frontend
        run: npm ci

      - name: Frontend - lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend - build
        working-directory: frontend
        run: npm run build

  docker:
    name: Build & push Docker images
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend - build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            lazher789/redstore-backend:latest
            lazher789/redstore-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=redstore-backend
          cache-to: type=gha,mode=max,scope=redstore-backend

      - name: Frontend - build & push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            lazher789/redstore-frontend:latest
            lazher789/redstore-frontend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=redstore-frontend
          cache-to: type=gha,mode=max,scope=redstore-frontend

  deploy:
    name: Deploy to Render
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Les secrets ne sont pas utilisables dans un "if:" : on les passe en env et on teste en shell.
      # Hook absent => message + succès (le déploiement Render n'est pas encore configuré).
      - name: Trigger Render deploy hooks
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          trigger() {
            name="$1"; url="$2"
            if [ -z "$url" ]; then
              echo "::notice::Secret RENDER_DEPLOY_HOOK_${name} absent : déploiement ${name} ignoré."
              return 0
            fi
            echo "Déclenchement du déploiement ${name}..."
            curl -fsS -X POST "$url" -o /dev/null
            echo "Déploiement ${name} déclenché."
          }
          trigger BACKEND "$HOOK_BACKEND"
          trigger FRONTEND "$HOOK_FRONTEND"
