# Configuration SonarQube Cloud (lue par SonarSource/sonarqube-scan-action dans le job "sonarqube")
#
sonar.organization=benmassaoudlazher789-creator
sonar.projectKey=benmassaoudlazher789-creator_APP-E-Commerce

sonar.projectName=Red Store

# Code analysé : API Express + sources React
sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/scripts/**,backend/tests/**

# Tests backend (Jest) : déclarés comme tests, pas comme code source
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.js

# Couverture produite par "npm run test:coverage" dans le job check-backend (artefact)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Fichiers de plomberie/config : exclus du calcul de couverture "New Code"
# (server.js = bootstrap + middlewares, product.controller.js = fix logging)
sonar.coverage.exclusions=\
  backend/server.js,\
  backend/controller/product.controller.js

sonar.sourceEncoding=UTF-8