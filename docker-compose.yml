# Mode par défaut : backend + frontend, base de données MongoDB Atlas (MONGODB_URI dans backend/.env).
#   docker compose up --build
# Les variables ${...} ci-dessous sont lues depuis le fichier .env à la racine (voir .env.example).
name: redstore

services:
  backend:
    build: ./backend
    image: lazher789/redstore-backend
    env_file: backend/.env
    environment:
      # Forcé ici pour rester cohérent avec BACKEND_URL du frontend, quelle que soit la valeur de backend/.env
      PORT: "1980"
      # Lien de réinitialisation de mot de passe : l'app est servie sur le port 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Un seul proxy (Nginx) devant l'API en local
      TRUST_PROXY: "1"
    # Pas de port publié : l'API n'est joignable qu'à travers Nginx (http://localhost:8080/api)
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    image: lazher789/redstore-frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://backend:1980
    depends_on:
      - backend
    restart: unless-stopped
